services:
  # ── Django Backend ─────────────────────────────────────────────────────────
  - type: web
    name: mindwell-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py seed_support_groups
    startCommand: daphne -b 0.0.0.0 -p $PORT mental_health_backend.asgi:application
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: mental_health_backend.settings
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: mindwell-backend.onrender.com,.onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://heal-hope-hh.vercel.app,https://mindwell-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: mindwell-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mindwell-redis
          type: redis
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false                  # You set this manually in Render dashboard
      - key: GROQ_API_KEY
        sync: false                  # Set in Render dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false                  # Your Gmail address — set in Render dashboard
      - key: EMAIL_HOST_PASSWORD
        sync: false                  # Gmail App Password — set in Render dashboard
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIMS_EMAIL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── Daily goal deadline reminder (cron) ────────────────────────────────────
  - type: cron
    name: mindwell-goal-reminders
    runtime: python
    rootDir: backend
    schedule: "0 8 * * *"           # Every day at 08:00 UTC
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python manage.py send_goal_reminders
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: mental_health_backend.settings
      - key: SECRET_KEY
        fromService:
          name: mindwell-backend
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: mindwell-db
          property: connectionString
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  # ── Redis (for WebSocket channel layer) ────────────────────────────────────
  - type: redis
    name: mindwell-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  - name: mindwell-db
    plan: free
    databaseName: mindwell
    user: mindwell

services:
  # ── Django Backend ─────────────────────────────────────────────────────────
  - type: web
    name: healhope-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: uvicorn mental_health_backend.asgi:application --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 120
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: mental_health_backend.settings
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: healhope-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://healhope.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: healhope-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: healhope-redis
          type: redis
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false                  # You set this manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── Redis (for WebSocket channel layer) ────────────────────────────────────
  - type: redis
    name: healhope-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  - name: healhope-db
    plan: free
    databaseName: healhope
    user: healhope
